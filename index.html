<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="JSON、CSVデータをカード形式で表示する汎用ビューア、Mica。表示項目の設定や検索・絞り込み、カードの編集・並べ替え、JSON・CSVの入出力に対応しています。" />
  <meta property="og:title" content="Mica">
  <meta property="og:description" content="JSON、CSVデータをカード形式で表示する汎用ビューア、Mica。表示項目の設定や検索・絞り込み、カードの編集・並べ替え、JSON・CSVの入出力に対応しています。">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Mica</title>
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <link rel="stylesheet" href="output.css">
  <script src="Sortable.js"></script>
  <script src="main.js"></script>
  <script src="ports.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    (async () => {
      let savedState = null;
      try {
        if (typeof loadState === "function") {
          savedState = await loadState();
        }
      } catch (err) {
        console.warn("card-viewer: failed to load initial state", err);
      }

      // ストレージの応答がない場合にデータをモックで上書きしないよう保護
      if (savedState === "LOAD_ERROR") {
        document.getElementById("app").innerHTML = `
          <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; font-family: sans-serif; color: #404040;">
            <p style="font-size: 14px; font-weight: bold;">保存データの読み込みに時間がかかっています</p>
            <button onclick="location.reload()" style="padding: 8px 16px; font-size: 12px; background: #171717; color: white; border: none; border-radius: 6px; cursor: pointer;">
              再読み込みする
            </button>
          </div>
        `;
        return;
      }

      window.appInstance = Elm.Main.init({
        node: document.getElementById("app"),
        flags: savedState !== undefined ? savedState : null
      });

      initPorts(window.appInstance);
    })();
  </script>
</body>
</html>
